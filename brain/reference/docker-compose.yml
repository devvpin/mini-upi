services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: miniupi
      POSTGRES_USER: miniupi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miniupi -d miniupi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro      # CA/PSP/Switch/Bank keys, outside git
    expose:
      - "8000"

  web:
    build: ./web
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - web

volumes:
  pgdata:
  caddy_data:
